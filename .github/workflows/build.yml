name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar arquivos de producao com warnings visiveis
        run: npm run build

      - name: Salvar arquivos de producao
        uses: actions/upload-artifact@v4
        with:
          name: build-producao
          path: build/
          if-no-files-found: error
